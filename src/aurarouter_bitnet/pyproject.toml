[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurarouter-bitnet"
version = "0.1.0"
authors = [{ name = "Steven Siebert", email = "info@auracoredynamics.com" }]
description = "BitNet (1-bit LLM) CPU backend for AuraRouter"
readme = "README.md"
requires-python = ">=3.11"

[project.entry-points."aurarouter.backends"]
bitnet = "aurarouter_bitnet"

[tool.hatch.build.targets.wheel]
packages = ["aurarouter_bitnet"]

[tool.hatch.build.targets.wheel.force-include]
"aurarouter_bitnet/bin" = "aurarouter_bitnet/bin"
